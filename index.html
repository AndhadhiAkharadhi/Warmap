<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloRoute — Berne → Berlin</title>
    <link rel="manifest" href="data:application/manifest+json,{
        \"name\": \"VeloRoute Berne-Berlin\",
        \"short_name\": \"VeloRoute\",
        \"start_url\": \".\",
        \"display\": \"standalone\",
        \"background_color\": \"#111111\",
        \"theme_color\": \"#4ade80\",
        \"icons\": [{
            \"src\": \"https://via.placeholder.com/192x192/111827/4ade80?text=🚲\",
            \"sizes\": \"192x192\",
            \"type\": \"image/png\"
        }]
    }">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin:0; padding:0; font-family: system-ui, sans-serif; background:#111827; color:#e5e7eb; }
        #map { height: 100vh; width: 100%; }
        .tab { display: none; padding: 15px; }
        .active { display: block; }
        .controls { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(17,24,39,0.95); padding: 10px; border-radius: 8px; }
        button { margin: 5px; padding: 8px 12px; background: #4ade80; color: #111827; border: none; border-radius: 6px; cursor: pointer; }
        .status { position: absolute; bottom: 10px; left: 10px; background: rgba(17,24,39,0.9); padding: 5px 10px; border-radius: 6px; font-size: 0.85rem; }
        .elevation { height: 180px; background: #1f2937; margin: 10px; border-radius: 8px; }
        .glow { filter: drop-shadow(0 0 8px #4ade80); }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="controls">
        <button onclick="toggleTab('route')">Route</button>
        <button onclick="toggleTab('weather')">Wetter</button>
        <button onclick="toggleTab('train')">Bahn</button>
        <button onclick="exportGPX()">GPX Export</button>
        <button onclick="shareRoute()">Teilen</button>
    </div>

    <div class="status" id="status">Berne → Berlin • 720 km • Ultraflach</div>

    <!-- Tabs -->
    <div id="route" class="tab active">
        <h3>Route & Höhenprofil</h3>
        <div class="elevation" id="elevation"></div>
    </div>

    <div id="weather" class="tab">
        <h3>Wetter am ausgewählten Punkt</h3>
        <div id="weather-info">Klicke auf einen Marker</div>
    </div>

    <div id="train" class="tab">
        <h3>Bahn-Optionen</h3>
        <ul id="train-list"></ul>
    </div>

    <script>
        // === Service Worker für Offline ===
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:application/javascript,'
                + 'const CACHE = "veloroute-v1";'
                + 'self.addEventListener("install", e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(["/"]))));'
                + 'self.addEventListener("fetch", e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));'
            ).then(() => console.log('Offline-Support aktiv'));
        }

        // Leaflet Karte
        const map = L.map('map').setView([51.0, 10.5], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 18
        }).addTo(map);

        // Dark Style
        const style = document.createElement('style');
        style.innerHTML = `.leaflet-tile-container { filter: invert(90%) hue-rotate(180deg) brightness(0.95) contrast(1.1); }`;
        document.head.appendChild(style);

        // Route Daten (vereinfacht, real \~720km)
        const routeCoords = [
            [46.95, 7.45], // Berne
            [48.0, 7.8],   // Freiburg
            [49.4, 8.7],   // Mannheim
            [50.1, 8.7],   // Frankfurt
            [51.3, 9.5],   // Kassel
            [52.4, 10.8],  // Braunschweig
            [52.52, 13.4]  // Berlin
        ];

        const polyline = L.polyline(routeCoords, {
            color: '#4ade80',
            weight: 6,
            opacity: 0.9,
            dashArray: '15, 10',
            className: 'glow'
        }).addTo(map);

        // Waypoints + Bahnhöfe
        const waypoints = [
            {pos: [46.95, 7.45], name: "Berne Start", type: "start", color: "green"},
            {pos: [47.6, 8.0], name: "Basel", type: "minor"},
            {pos: [48.0, 7.8], name: "Freiburg", type: "major"},
            {pos: [49.4, 8.7], name: "Mannheim", type: "major"},
            {pos: [50.1, 8.7], name: "Frankfurt", type: "major"},
            {pos: [52.52, 13.4], name: "Berlin Ziel", type: "end", color: "purple"}
        ];

        waypoints.forEach(wp => {
            const marker = L.circleMarker(wp.pos, {
                radius: 8,
                color: wp.color || (wp.type === "major" ? "green" : "blue")
            }).addTo(map).bindPopup(`<b>\( {wp.name}</b><br><button onclick="getWeather( \){wp.pos[0]},${wp.pos[1]})">Wetter laden</button>`);
        });

        // Einfaches Höhenprofil (SVG)
        function createElevation() {
            const svg = `<svg width="100%" height="160" viewBox="0 0 600 160" style="background:#1f2937">
                <polyline points="0,140 100,120 200,115 300,105 400,100 500,95 600,90" fill="none" stroke="#4ade80" stroke-width="6"/>
                <text x="20" y="30" fill="#9ca3af">Ultraflach: max +280m / -190m</text>
            </svg>`;
            document.getElementById('elevation').innerHTML = svg;
        }
        createElevation();

        // Wetter (Open-Meteo)
        async function getWeather(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=\( {lat}&longitude= \){lon}&current=temperature_2m,apparent_temperature,wind_speed_10m,relative_humidity_2m,precipitation,weather_code`);
                const data = await res.json();
                const w = data.current;
                document.getElementById('weather-info').innerHTML = `
                    <b>${w.temperature_2m}°C</b> (gefühlt ${w.apparent_temperature}°C)<br>
                    Wind: ${w.wind_speed_10m} km/h • Feuchte: ${w.relative_humidity_2m}%<br>
                    Niederschlag: ${w.precipitation} mm
                `;
                toggleTab('weather');
            } catch(e) {
                document.getElementById('weather-info').innerHTML = "Offline / Fehler beim Wetter-Laden";
            }
        }

        // Bahn-Tab
        document.getElementById('train-list').innerHTML = `
            <li>Berne → Basel (DB/ SBB) — <a href="https://reiseauskunft.bahn.de" target="_blank">Link</a></li>
            <li>Freiburg → Mannheim — ca. 2h</li>
            <li>Frankfurt → Berlin (ICE) — direkte Verbindung</li>
        `;

        function toggleTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
        }

        function exportGPX() {
            const gpx = `<?xml version="1.0"?><gpx><trk><name>Berne-Berlin</name><trkseg>\( {routeCoords.map(c => `<trkpt lat=" \){c[0]}" lon="${c[1]}"></trkpt>`).join('')}</trkseg></trk></gpx>`;
            navigator.clipboard.writeText(gpx);
            alert("GPX in Zwischenablage kopiert!");
        }

        function shareRoute() {
            const text = "🚲 VeloRoute Berne → Berlin — Ultraflache 720km Tour! https://veloroute.example";
            if (navigator.share) navigator.share({title: "VeloRoute", text});
            else {
                navigator.clipboard.writeText(text);
                alert("Link kopiert (Telegram/WhatsApp bereit)");
            }
        }

        // Init
        console.log("%cVeloRoute Berne → Berlin Offline App bereit! 🚲", "color:#4ade80; font-size:16px");
    </script>
</body>
</html>
